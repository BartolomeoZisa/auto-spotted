name: Spotted Bot Automation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > credentials.json

      - name: Step 1 - Generate Image & Prepare Post
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: "credentials.json"
        run: python main.py

      - name: Step 2 - Commit & Push new image to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add post_*.jpg || true
          git add -u post_*.jpg || true
          git commit -m "Add new timestamped post image & clean old posts" || echo "No changes to commit"
          git push

      - name: Step 3 - Wait for GitHub Pages propagation
        run: sleep 10

      - name: Step 4 - Publish to Instagram
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: "credentials.json"
        run: python main.py --publish