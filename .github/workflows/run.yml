name: Spotted Bot Automation

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > credentials.json

      - name: Step 1 - Generate Image & Prepare Post
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: "credentials.json"
        run: python main.py

      - name: Step 2 - Commit & Push new image to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add post_*.jpg || true
          git add -u post_*.jpg || true
          git commit -m "Add timestamped post image and remove previous image" || echo "No changes to commit"
          git push

      - name: Step 3 - Poll and Verify Image Availability
        run: |
          if [ -f pending_post.json ]; then
            FILENAME=$(jq -r '.filename' pending_post.json)
            BASE_URL=$(echo "${{ secrets.IMAGE_URL }}" | sed 's/\/*$//')
            FULL_URL="$BASE_URL/$FILENAME"
            
            echo "Checking image availability at: $FULL_URL"
            
            SUCCESS=false
            for i in {1..18}; do
              if curl --output /dev/null --silent --head --fail "$FULL_URL"; then
                echo "✅ Image is live on GitHub Pages!"
                SUCCESS=true
                break
              fi
              echo "Attempt $i/18: Not available yet. Retrying in 10s..."
              sleep 10
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ Image failed to become available on GitHub Pages in time."
              exit 1
            fi
          fi

      - name: Step 4 - Publish to Instagram
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: "credentials.json"
        run: python main.py --publish